# ==============================================================================
# AURA Quant Terminal v3 — Docker Compose (Proxmox Linux-VM / Homelab)
# ==============================================================================

services:
  # 1. API & Web Dashboard Server
  aura-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura-quant-terminal:3.0.0
    container_name: aura-api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${AURA_HOST:-127.0.0.1}:${AURA_PORT:-8000}:8000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      - AURA_DB_PATH=/data/aura_state.db
      - AURA_RELAY_TOKEN=${AURA_RELAY_TOKEN}
    volumes:
      - aura_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v3/health', timeout=4)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 2. Autonomer 24/7 Hintergrund-Worker (Scanner, Runner, ntfy)
  aura-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura-quant-terminal:3.0.0
    container_name: aura-worker
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      - AURA_DB_PATH=/data/aura_state.db
      - AURA_NTFY_URL=${AURA_NTFY_URL}
      - AURA_RELAY_TOKEN=${AURA_RELAY_TOKEN}
    volumes:
      - aura_data:/data
    command: ["python3", "-m", "aura.runner.worker"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  aura_data:
    name: aura_v3_data

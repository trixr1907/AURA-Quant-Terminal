# ==============================================================================
# AURA Quant Terminal - Docker Compose Config (Local & Homelab / Self-Hosted)
# ==============================================================================

services:
  aura-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura-quant-terminal:latest
    container_name: aura-terminal
    restart: unless-stopped
    ports:
      - "${AURA_PORT:-8787}:8787"
    environment:
      - SYM_PORT=8787
      - SYM_HOST=0.0.0.0   # bind all interfaces inside the container; Docker controls external access
      - AURA_ALLOWED_HOSTS=${AURA_ALLOWED_HOSTS:-127.0.0.1}
      - AURA_STATE_DIR=/var/lib/aura
    volumes:
      - aura-state:/var/lib/aura
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/ready', timeout=4)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  aura-state:
    name: aura-state

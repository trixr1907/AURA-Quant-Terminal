# ==============================================================================
# AURA Quant Terminal - Docker Compose Config (Local & Homelab / Self-Hosted)
# ==============================================================================

services:
  aura-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura-quant-terminal:latest
    container_name: aura-terminal
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${AURA_HOST:-127.0.0.1}:${AURA_PORT:-8787}:8787"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      - SYM_PORT=8787
      - SYM_HOST=0.0.0.0   # bind all interfaces inside the container; Docker controls external access
      - AURA_ALLOWED_HOSTS=${AURA_ALLOWED_HOSTS:-127.0.0.1}
      - AURA_STATE_DIR=/var/lib/aura
      - AURA_NTFY_URL
      - AURA_NTFY_BTC=${AURA_NTFY_BTC:-1}
      - AURA_NTFY_BTC_COOLDOWN_MIN=${AURA_NTFY_BTC_COOLDOWN_MIN:-30}
      - AURA_NTFY_DIGEST=${AURA_NTFY_DIGEST:-1}
      - AURA_NTFY_DIGEST_UTC=${AURA_NTFY_DIGEST_UTC:-7}
      - AURA_NTFY_ERRORS=${AURA_NTFY_ERRORS:-1}
    volumes:
      - aura-state:/var/lib/aura
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/ready', timeout=4)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  aura-state:
    name: aura-state

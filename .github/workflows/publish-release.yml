name: Publish GitHub Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing SemVer tag to publish (for example v1.0.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          else
            tag="$PUSH_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag and VERSION agree
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          test "v$(tr -d '\r\n' < VERSION)" = "$TAG"
          git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install release dependencies
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Build distributable archive
        shell: bash
        run: |
          # The workflow checks out the release tag itself. Version consistency
          # still runs fail-closed; only the expected same-tag progression case
          # is allowed here.
          python3 scripts/release_check.py --allow-current-version
          python3 scripts/build_package.py

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" symbiose.zip \
            --verify-tag \
            --title "AURA Quant Terminal $TAG" \
            --generate-notes

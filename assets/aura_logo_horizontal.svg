<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 64" fill="none" class="aura-combination-mark">
  <defs>
    <radialGradient id="hAuraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00F5A0" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hLaserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <linearGradient id="hFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#06090F"/>
    </linearGradient>
    
    <linearGradient id="hFacetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142238"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>

    <linearGradient id="hCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <filter id="hNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LOGO MARK (Left) -->
  <g transform="translate(4, 4)">
    <circle cx="28" cy="28" r="26" fill="url(#hAuraGlow)"/>
    <path d="M28 4 L6 48 L17 48 L28 26 L39 48 L50 48 Z" 
          fill="url(#hFacetLeft)" 
          stroke="url(#hLaserGrad)" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>
    <path d="M28 4 L50 48 L39 48 L28 26 Z" 
          fill="url(#hFacetRight)" 
          opacity="0.9"/>
    <path d="M14 39 L42 39" 
          stroke="url(#hLaserGrad)" 
          stroke-width="1.75" 
          stroke-linecap="round"/>
    <polygon points="28,19 33,28 28,37 23,28" 
             fill="url(#hCoreGrad)" 
             stroke="#FFFFFF" 
             stroke-width="0.5" 
             filter="url(#hNeonGlow)"/>
    <circle cx="28" cy="28" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- TYPOGRAPHY / WORDMARK (Right) -->
  <g transform="translate(72, 0)">
    <!-- Brand Title -->
    <text x="0" y="31" font-family="'JetBrains Mono', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="4" fill="#FFFFFF">AURA</text>
    <text x="110" y="31" font-family="'JetBrains Mono', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" letter-spacing="2" fill="#94A3B8">TERMINAL</text>
    
    <!-- Slogan / Subline -->
    <text x="0" y="49" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#38BDF8">QUANTITATIVE EDGE</text>
    <text x="125" y="49" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" letter-spacing="1.5" fill="#64748B">· VISUAL PRECISION</text>
  </g>
</svg>
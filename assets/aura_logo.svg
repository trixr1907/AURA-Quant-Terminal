<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" class="aura-brand-mark">
  <defs>
    <!-- Background Aura Glow -->
    <radialGradient id="auraAuraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00F5A0" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0"/>
    </radialGradient>

    <!-- Primary Electric Laser Gradient -->
    <linearGradient id="auraLaserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <!-- Deep Carbon Facet Fill -->
    <linearGradient id="auraFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#06090F"/>
    </linearGradient>
    
    <linearGradient id="auraFacetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142238"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>

    <!-- Core Crystal Glow -->
    <linearGradient id="auraCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="auraNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#auraAuraGlow)"/>

  <!-- Outer Geometric "A" Frame -->
  <!-- Left Leg & Apex -->
  <path d="M32 6 L8 54 L20 54 L32 30 L44 54 L56 54 Z" 
        fill="url(#auraFacetLeft)" 
        stroke="url(#auraLaserGrad)" 
        stroke-width="1.75" 
        stroke-linejoin="round"/>

  <!-- Right Facet Shading for 3D Depth -->
  <path d="M32 6 L56 54 L44 54 L32 30 Z" 
        fill="url(#auraFacetRight)" 
        opacity="0.9"/>

  <!-- Crossbeam Quantum Confluence Vector (Floating) -->
  <path d="M17 44 L47 44" 
        stroke="url(#auraLaserGrad)" 
        stroke-width="2" 
        stroke-linecap="round"/>

  <!-- Center Floating Aura Rhombus / Core Prism -->
  <polygon points="32,22 38,32 32,42 26,32" 
           fill="url(#auraCoreGrad)" 
           stroke="#FFFFFF" 
           stroke-width="0.75" 
           filter="url(#auraNeonGlow)"/>

  <!-- Subtle Core Spark Highlight -->
  <circle cx="32" cy="32" r="1.5" fill="#FFFFFF"/>
</svg>